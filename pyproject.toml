[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-cloud-gateway"
version = "0.1.0"
description = "A conservative, observable local/cloud gateway with an offline mock mode"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "anyio>=4,<5"]

[project.scripts]
edge-cloud-gateway = "edge_cloud_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edge_cloud_gateway = ["data/*.json"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
